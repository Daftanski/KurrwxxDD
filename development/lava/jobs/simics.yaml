# Generic Simics job. Do not submit by hand: lava-test.sh / submit.sh fill in
# job_name, tags, SETUP (uefi|kernel), STEPS (run-tests.sh steps) and PFP.
device_type: ssh
job_name: simics
priority: medium
visibility: public
tags: []

timeouts:
  job:
    minutes: 300
  action:
    minutes: 280
  connection:
    minutes: 2

actions:
- deploy:
    to: ssh
    os: fedora
    timeout:
      minutes: 2

- boot:
    method: ssh
    connection: ssh
    prompts:
    - 'root@'
    timeout:
      minutes: 2

- test:
    timeout:
      minutes: 280
    definitions:
    - from: inline
      name: simics
      path: inline/simics.yaml
      parameters:
        SETUP: "uefi"
        STEPS: "restart"
        PFP: "FALSE"
      repository:
        metadata:
          format: Lava-Test Test Definition 1.0
          name: simics
          description: run-tests.sh steps of development/<SETUP>-dev on the Simics host
        run:
          steps:
          - PATH=/root/.local/bin:$PATH PFP=$PFP /root/SimicsWorkspace/development/$SETUP-dev/misc/lava-run.sh $STEPS
